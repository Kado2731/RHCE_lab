---
- name: create hwreport
  hosts: all
  tasks:
    #    - name: download hwreport
    #      get_url:
    #        url: https://blablabla
    #       dest: /root/hwreport.txt
    - name: copy hwreport
      copy:
        src: ./hwreport.empty
        dest: /root/hwreport.txt

    - name: user replace module
      replace:
        path: /root/hwreport.txt
        regexp: "{{ item.oldvalue }}"
        replace: "{{ item.newvalue }}"
      loop:
          - oldvalue: hostname
            newvalue: "{{ ansible_hostname }}"
          - oldvalue: biosversion
            newvalue: "{{ ansible_bios_version }}"
          - oldvalue: memory
            newvalue: "{{ ansible_memtotal_mb }}"
          - oldvalue: sdasize
            newvalue: "{{ ansible_devices.sda.size }}"
          - oldvalue: sdbsize
            newvalue: "{{ ansible_devices.sdb.size }}"
